<?xml version="1.0" encoding="UTF-8"?>
<!-- Android adaptive-icon background layer. Full-bleed: the OS mask crops it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="amber" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFC85A"/>
      <stop offset="1" stop-color="#E87C08"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#amber)"/>
  <rect width="1024" height="1024" fill="url(#gloss)"/>
</svg>
