name: PR Test

on:
  pull_request:
    branches:
      # develop is the integration trunk: feature PRs land there, so without it
      # every feature PR reported no checks at all and only got tested once the
      # release PR reached master.
      - develop
      - master

# PR code is untrusted: give its runs a read-only token.
permissions:
  contents: read

# One run per PR: a push supersedes whatever is still compiling for that PR
# instead of queueing another full Rust + Flutter suite beside it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Flutter is pinned so a new stable release never changes CI under an open PR.
# Bump it together with release.yml and with the Android toolchain in
# app/android (Gradle wrapper, AGP and Kotlin in settings.gradle.kts): each
# Flutter release raises the minimum versions its Gradle plugin accepts, and
# the `android` job below is what proves the pair still builds.
env:
  FLUTTER_VERSION: 3.50.0

jobs:
  # The app suite needs no Rust at all: nothing under app/test loads the native
  # bridge, so this runs beside the crate jobs instead of behind them.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libkeybinder-3.0-dev libnotify-dev

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        # Infos stay visible but non-fatal: Flutter >= 3.47 deprecates
        # package:flutter/material.dart (migration to material_ui is separate);
        # warnings and errors still fail the job.
        run: flutter analyze --no-fatal-infos

      - name: Test (app)
        working-directory: app
        run: flutter test

  # forui-based UI kit: pure Dart widgets, no native bridge, so a small job.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Pure shell, no Flutter needed: fails on new Material IconButton /
      # AlertDialog / SnackBar / Icons. / ScaffoldMessenger outside yourssh_ui.
      - name: UI lint gate
        run: |
          bash tool/check_ui_lint_selftest.sh
          bash tool/check_ui_lint.sh

      - name: Install dependencies
        working-directory: packages/yourssh_ui
        run: flutter pub get

      - name: Analyze (yourssh_ui)
        working-directory: packages/yourssh_ui
        run: flutter analyze --no-fatal-infos

      - name: Test (yourssh_ui)
        working-directory: packages/yourssh_ui
        run: flutter test

  # Plugin packages built on yourssh_ui; pure Dart/Flutter, no native bridge.
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [yourssh_snippets, yourssh_devops, yourssh_web_tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: flutter pub get

      - name: Analyze (${{ matrix.package }})
        working-directory: packages/${{ matrix.package }}
        run: flutter analyze --no-fatal-infos

      - name: Test (${{ matrix.package }})
        working-directory: packages/${{ matrix.package }}
        run: flutter test

  # One job per Rust crate. The cargo tests, build.sh and the Dart bridge tests
  # stay together on purpose: both cargo invocations use --release, so the
  # library build reuses the test build's compilation. Splitting them across jobs
  # would compile the IronRDP / vnc-rs tree twice.
  bridge:
    name: bridge (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      # A broken RDP crate should not hide a broken VNC crate.
      fail-fast: false
      matrix:
        crate: [yourssh_rdp, yourssh_vnc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/${{ matrix.crate }}/rust

      - name: Rust tests
        run: cargo test --release --manifest-path packages/${{ matrix.crate }}/rust/Cargo.toml

      - name: Build native library for Dart tests
        run: bash packages/${{ matrix.crate }}/build.sh

      - name: Dart tests
        working-directory: packages/${{ matrix.crate }}
        run: flutter test

  # Debug APK only: proves the Android toolchain (Gradle / AGP / Kotlin in
  # app/android) still satisfies the pinned Flutter's Gradle plugin and that
  # every Android plugin module, including the flutter_pty fork's CMake build,
  # still compiles. It needs no secrets: debug builds sign with the debug key
  # the Android SDK generates, and the mobile UI is SSH-only, so no Rust
  # libraries are built (same as release.yml's build-android).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # AGP 9 needs JDK 17 or newer; 17 matches release.yml's build-android.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

  # Pure-Dart CLI protocol package: no Flutter, no native libs.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        working-directory: packages/yourssh_cli
        run: dart pub get

      - name: Test (yourssh_cli)
        working-directory: packages/yourssh_cli
        run: dart test

      - name: Compile smoke (yourssh_cli)
        working-directory: packages/yourssh_cli
        run: dart compile exe bin/yourssh.dart -o "$RUNNER_TEMP/yourssh"

  # The Windows CLI endpoint (named pipe, DACL, SID checks, cli.lock) only
  # runs on Windows: the package suite, a compile smoke and the app's CLI
  # tests on a real runner. No app build.
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies (yourssh_cli)
        working-directory: packages/yourssh_cli
        run: dart pub get

      - name: Test (yourssh_cli)
        working-directory: packages/yourssh_cli
        run: dart test

      - name: Compile smoke (yourssh_cli)
        working-directory: packages/yourssh_cli
        shell: bash
        run: dart compile exe bin/yourssh.dart -o "$RUNNER_TEMP/yourssh.exe"

      - name: Install dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Test (app CLI services)
        working-directory: app
        run: flutter test test/services/cli/

  # Aggregate gate. master's branch protection requires a check literally named
  # "test", so that name has to survive the split — this job carries it, and it
  # is red unless every job above is green. `always()` matters: without it the
  # job would be skipped when something fails, leaving the required check pending
  # forever instead of failing.
  test:
    name: test
    needs: [app, ui, bridge, android, cli, windows-cli]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "app=${{ needs.app.result }} ui=${{ needs.ui.result }} bridge=${{ needs.bridge.result }} android=${{ needs.android.result }} cli=${{ needs.cli.result }} windows-cli=${{ needs.windows-cli.result }}"
          [ "${{ needs.app.result }}" = "success" ] || exit 1
          [ "${{ needs.ui.result }}" = "success" ] || exit 1
          [ "${{ needs.bridge.result }}" = "success" ] || exit 1
          [ "${{ needs.android.result }}" = "success" ] || exit 1
          [ "${{ needs.cli.result }}" = "success" ] || exit 1
          [ "${{ needs.windows-cli.result }}" = "success" ] || exit 1
