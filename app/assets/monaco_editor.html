<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0E0C0A; overflow: hidden; }
    #editor { width: 100%; height: 100%; }
    #status {
      position: fixed; bottom: 0; left: 0; right: 0; height: 24px;
      background: #161412; color: #A8A29E; font-family: monospace; font-size: 11px;
      display: flex; align-items: center; padding: 0 12px; gap: 16px;
      border-top: 1px solid rgba(255, 235, 210, 0.12);
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div id="status">
    <span id="status-lang">Plain Text</span>
    <span id="status-pos">Ln 1, Col 1</span>
    <span id="status-msg"></span>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      // Theme built from the YourSSH design tokens (YsColors, Amber Brand).
      monaco.editor.defineTheme('yourssh-amber', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#0E0C0A',          // terminalSurface
          'editor.foreground': '#E7E5E4',
          'editor.selectionBackground': '#F3A23155', // primary @ 0x55
          'editor.inactiveSelectionBackground': '#F3A23133',
          'editorCursor.foreground': '#F3A231',      // primary
          'editorLineNumber.foreground': '#A8A29E',  // mutedForeground
          'editorLineNumber.activeForeground': '#E7E5E4',
          'editorGutter.background': '#161412',      // card
          'editor.lineHighlightBackground': '#161412',
          'editorWidget.background': '#161412',
        },
      });

      const editor = monaco.editor.create(document.getElementById('editor'), {
        value: '',
        language: 'plaintext',
        theme: 'yourssh-amber',
        fontSize: 13,
        fontFamily: "'MesloLGS NF', Menlo, Consolas, monospace",
        automaticLayout: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
      });

      document.getElementById('editor').style.height = 'calc(100% - 24px)';

      let _contentLoaded = false;

      editor.onDidChangeCursorPosition(e => {
        document.getElementById('status-pos').textContent =
          `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });

      editor.onDidChangeModelContent(function() {
        if (!_contentLoaded) return;
        if (window.FlutterChannel) {
          window.FlutterChannel.postMessage(JSON.stringify({ type: 'change' }));
        }
      });

      window.loadContent = function(content, language) {
        _contentLoaded = false;
        monaco.editor.setModelLanguage(editor.getModel(), language || 'plaintext');
        editor.setValue(content);
        document.getElementById('status-lang').textContent = language || 'Plain Text';
        editor.setScrollPosition({ scrollTop: 0 });
        _contentLoaded = true;
      };

      window.getContent = function() {
        return editor.getValue();
      };

      window.setReadOnly = function(readonly) {
        editor.updateOptions({ readOnly: readonly });
      };

      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function() {
        if (window.FlutterChannel) {
          window.FlutterChannel.postMessage(JSON.stringify({
            type: 'save',
            content: editor.getValue(),
          }));
        }
      });

      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify({ type: 'ready' }));
      }
    });
  </script>
</body>
</html>
